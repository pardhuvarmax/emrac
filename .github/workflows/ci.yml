name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # libalpm (and the pacman tools emrac calls) only exist on Arch.
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git clang rust bubblewrap

      - uses: actions/checkout@v4

      # The tests expect an ordinary user (emrac warns when run as root and some
      # checks need root to fail), so everything below runs as one.
      - name: Make an ordinary user
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Format, lints, tests, scripts, test list
        run: su ci -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory '$GITHUB_WORKSPACE' && sh dev/ci.sh"
