[package]
name = "emrac-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A hybrid package management platform for Arch Linux"

[[bin]]
name = "emrac"
path = "src/main.rs"

[dependencies]
emrac-core = { path = "../emrac-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
libc = "0.2"
